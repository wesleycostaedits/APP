<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#131f45"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="goal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/>
  </g>

  <!-- title -->
  <text x="800" y="105" text-anchor="middle" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="1">Contorno de Objeção</text>
  <text x="800" y="150" text-anchor="middle" fill="#a5b4fc" font-size="26">Não bata de frente com o obstáculo — contorne e siga até o “sim”.</text>

  <!-- direct path that crashes (dashed, faded) -->
  <path d="M230 520 L610 520" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6" stroke-dasharray="14 14" fill="none"/>
  <g transform="translate(628 520)" stroke="#fca5a5" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round">
    <path d="M-14 -14 L14 14 M14 -14 L-14 14"/>
  </g>

  <!-- the main path flowing around the obstacle -->
  <path d="M230 520 C420 520 470 520 540 470 C620 410 640 300 800 290 C960 300 980 410 1060 470 C1130 520 1180 520 1330 520"
        stroke="url(#path)" stroke-width="16" fill="none" stroke-linecap="round" filter="url(#glow)" marker-end="url(#arrow)"/>

  <!-- obstacle / objection -->
  <g filter="url(#shadow)">
    <path d="M660 640 C640 560 670 470 740 440 C800 415 860 420 910 455 C965 495 970 580 945 640 Z" fill="url(#rock)"/>
    <path d="M700 520 C720 480 760 462 800 462" stroke="#fecaca" stroke-opacity="0.35" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <text x="803" y="575" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="3">OBJEÇÃO</text>
  <rect x="600" y="638" width="400" height="10" rx="5" fill="#000" fill-opacity="0.25"/>

  <!-- objection speech bubbles -->
  <g font-size="22" font-weight="600">
    <g transform="translate(560 690)">
      <rect x="-90" y="0" width="180" height="50" rx="25" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
      <text x="0" y="33" text-anchor="middle" fill="#fecaca">“Está caro”</text>
    </g>
    <g transform="translate(803 720)">
      <rect x="-100" y="0" width="200" height="50" rx="25" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
      <text x="0" y="33" text-anchor="middle" fill="#fecaca">“Vou pensar”</text>
    </g>
    <g transform="translate(1050 690)">
      <rect x="-120" y="0" width="240" height="50" rx="25" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
      <text x="0" y="33" text-anchor="middle" fill="#fecaca">“Não é o momento”</text>
    </g>
  </g>

  <!-- start: seller -->
  <g transform="translate(170 520)">
    <circle r="62" fill="#1e3a8a" stroke="#38bdf8" stroke-width="4"/>
    <circle cy="-16" r="18" fill="#e0f2fe"/>
    <path d="M-32 32 C-28 6 28 6 32 32 Z" fill="#e0f2fe"/>
    <text y="100" text-anchor="middle" fill="#e0f2fe" font-size="24" font-weight="700">Vendedor</text>
  </g>

  <!-- goal: closed deal -->
  <g transform="translate(1420 520)">
    <circle r="120" fill="url(#goal)"/>
    <circle r="66" fill="#065f46" stroke="#34d399" stroke-width="4"/>
    <path d="M-28 2 L-8 24 L30 -22" stroke="#ffffff" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="104" text-anchor="middle" fill="#d1fae5" font-size="24" font-weight="700">Venda fechada</text>
  </g>

  <!-- steps along the path -->
  <g font-size="20" font-weight="700" fill="#ffffff">
    <g transform="translate(470 505)">
      <circle r="22" fill="#0ea5e9"/><text y="7" text-anchor="middle">1</text>
      <text x="0" y="-38" text-anchor="middle" fill="#bae6fd">Ouvir</text>
    </g>
    <g transform="translate(615 375)">
      <circle r="22" fill="#6366f1"/><text y="7" text-anchor="middle">2</text>
      <text x="-30" y="-34" text-anchor="middle" fill="#c7d2fe">Validar</text>
    </g>
    <g transform="translate(800 290)">
      <circle r="22" fill="#8b5cf6"/><text y="7" text-anchor="middle">3</text>
      <text x="0" y="-38" text-anchor="middle" fill="#ddd6fe">Perguntar</text>
    </g>
    <g transform="translate(985 375)">
      <circle r="22" fill="#6366f1"/><text y="7" text-anchor="middle">4</text>
      <text x="30" y="-34" text-anchor="middle" fill="#c7d2fe">Responder</text>
    </g>
    <g transform="translate(1135 515)">
      <circle r="22" fill="#10b981"/><text y="7" text-anchor="middle">5</text>
      <text x="0" y="-38" text-anchor="middle" fill="#a7f3d0">Fechar</text>
    </g>
  </g>

  <text x="800" y="860" text-anchor="middle" fill="#64748b" font-size="20">Toda objeção é um pedido de mais informação.</text>
</svg>
